<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extracted Study Hub Library</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c31;--muted:#9eacc8;--line:#283653;--accent:#6d8cff;--text:#f2f5ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:22px clamp(16px,4vw,42px);border-bottom:1px solid var(--line);background:#0e1528;position:sticky;top:0;z-index:5}
h1{margin:0 0 5px;font-size:clamp(21px,3vw,30px)}.sub{color:var(--muted);margin:0}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 100px)}
aside{padding:18px;border-right:1px solid var(--line);background:#0e1528;max-height:calc(100vh - 100px);overflow:auto}
main{padding:clamp(14px,3vw,30px);min-width:0}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0b1020;color:var(--text);margin-bottom:14px}
.cat{margin:16px 0 7px;color:#9eacc8;text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:800}
.page-btn{display:block;width:100%;text-align:left;background:transparent;color:var(--text);border:1px solid transparent;border-radius:9px;padding:10px;margin:3px 0;cursor:pointer;overflow-wrap:anywhere}
.page-btn:hover,.page-btn.active{background:#1b2946;border-color:#31466f}.welcome{border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--panel)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;text-align:left;color:var(--text);cursor:pointer}
.card small{display:block;color:var(--muted);margin-top:7px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.action{background:var(--accent);color:white;border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}
.frame{width:100%;height:78vh;min-height:480px;border:1px solid var(--line);border-radius:12px;background:white}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}.links a{color:#aebeff;overflow-wrap:anywhere}
.note{color:var(--muted);font-size:13px}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{position:static;max-height:38vh;border-right:0;border-bottom:1px solid var(--line)}.frame{height:72vh;min-height:390px}}
</style>
</head>
<body>
<header><h1>Extracted Study Hub Library</h1><p class="sub" id="summary">Loading extracted pages…</p></header>
<div class="layout">
<aside><input class="search" id="search" placeholder="Search courses / pages…" aria-label="Search courses and pages"><nav id="nav"></nav></aside>
<main id="main"><section class="welcome"><h2>Study library</h2><p>Choose a category or page from the left to open its original content.</p></section></main>
</div>
<script src="data.js"></script>
<script>
(function(){
 const lib=window.LECTURE_LIBRARY;
 const nav=document.getElementById('nav'), main=document.getElementById('main'), search=document.getElementById('search');
 if(!lib){document.getElementById('summary').textContent='data.js could not be loaded.';return}
 document.getElementById('summary').textContent=lib.pageCount+' original pages extracted from the supplied HTML.';
 const byId=new Map(lib.pages.map(p=>[p.id,p]));
 function openPage(id){
  const p=byId.get(id);if(!p)return;
  document.querySelectorAll('.page-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  main.replaceChildren();
  const h=document.createElement('h2');h.textContent=p.title;main.append(h);
  const meta=document.createElement('p');meta.className='note';meta.textContent='Original key: '+p.key+' · Extracted links: '+p.links.length;main.append(meta);
  if(p.links.length){const links=document.createElement('div');links.className='links';p.links.slice(0,80).forEach(l=>{const a=document.createElement('a');a.href=l.url;a.textContent=l.title;a.target='_blank';a.rel='noopener noreferrer';links.append(a)});main.append(links)}
  const toolbar=document.createElement('div');toolbar.className='toolbar';
  const full=document.createElement('button');full.className='action';full.textContent='⛶ Fullscreen content';toolbar.append(full);main.append(toolbar);
  const frame=document.createElement('iframe');frame.className='frame';frame.title=p.title;frame.setAttribute('allow','fullscreen; autoplay; encrypted-media; picture-in-picture');frame.setAttribute('allowfullscreen','');frame.srcdoc=p.html;main.append(frame);
  full.addEventListener('click',()=>{if(frame.requestFullscreen)frame.requestFullscreen();else if(frame.webkitRequestFullscreen)frame.webkitRequestFullscreen()});
 }
 function renderNav(q=''){
  nav.replaceChildren();const query=q.toLowerCase();
  lib.categories.forEach(c=>{
   const matches=c.pageIds.map(id=>byId.get(id)).filter(p=>(c.name+' '+p.title+' '+p.key).toLowerCase().includes(query));
   if(!matches.length)return;
   const label=document.createElement('div');label.className='cat';label.textContent=c.name;nav.append(label);
   matches.forEach(p=>{const b=document.createElement('button');b.className='page-btn';b.textContent=p.title;b.dataset.id=p.id;b.addEventListener('click',()=>openPage(p.id));nav.append(b)});
  });
  if(!nav.children.length){const p=document.createElement('p');p.className='note';p.textContent='No pages matched your search.';nav.append(p)}
 }
 renderNav();search.addEventListener('input',()=>renderNav(search.value));
 const grid=document.createElement('div');grid.className='grid';
 lib.pages.forEach(p=>{const b=document.createElement('button');b.className='card';b.innerHTML='';const strong=document.createElement('strong');strong.textContent=p.title;b.append(strong);const small=document.createElement('small');small.textContent=p.category+' · '+p.links.length+' extracted links';b.append(small);b.addEventListener('click',()=>openPage(p.id));grid.append(b)});
 const welcome=main.querySelector('.welcome');welcome.append(grid);
})();
</script>
</body>
</html>
